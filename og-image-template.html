<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Open Graph card, 1200x630. Rendered headless (Chromium screenshot, JPEG) to og-image.jpg.
       Only facts from the page's own metadata are drawn: the name, one line, the address. No stats, no claims. -->
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px; height: 630px; position: relative; overflow: hidden; font-family: 'Archivo', sans-serif;
      background-color: #070908;
      background-image: linear-gradient(#141816 1px, transparent 1px), linear-gradient(90deg, #141816 1px, transparent 1px);
      background-size: 40px 40px; color: #F1ECE2;
    }
    .eyebrow { position: absolute; left: 72px; top: 96px; font-weight: 600; font-size: 20px; letter-spacing: .14em; color: #7BC47F; }
    .name { position: absolute; left: 66px; top: 132px; font-weight: 800; font-size: 128px; letter-spacing: -.04em; line-height: 1; }
    .name i { font-style: normal; color: #7BC47F; }
    .line { position: absolute; left: 72px; top: 300px; font-size: 34px; color: #D9D3C7; max-width: 640px; line-height: 1.25; }
    .foot { position: absolute; left: 72px; bottom: 64px; font-weight: 600; font-size: 20px; color: #9A948A; }
    svg { position: absolute; right: 0; top: 0; }
  </style>
</head>
<body>
  <svg width="1200" height="630" viewBox="0 0 1200 630">
    <g transform="rotate(-8 820 385)"><rect x="760" y="300" width="120" height="170" rx="4" fill="#F1ECE2"/><text x="774" y="336" font-family="Archivo" font-weight="800" font-size="28" fill="#050707">K</text><text x="774" y="364" font-family="Archivo" font-size="24" fill="#050707">♠</text><text x="820" y="418" text-anchor="middle" font-family="Archivo" font-size="56" fill="#050707">♠</text></g><g transform="rotate(8 1060 385)"><rect x="1000" y="300" width="120" height="170" rx="4" fill="#F1ECE2"/><text x="1014" y="336" font-family="Archivo" font-weight="800" font-size="28" fill="#B23A22">Q</text><text x="1014" y="364" font-family="Archivo" font-size="24" fill="#B23A22">♥</text><text x="1060" y="418" text-anchor="middle" font-family="Archivo" font-size="56" fill="#B23A22">♥</text></g><g><rect x="880" y="120" width="120" height="170" rx="4" fill="#121110" stroke="#7BC47F" stroke-width="3"/><text x="940" y="200" text-anchor="middle" font-family="Archivo" font-weight="800" font-size="64" fill="#7BC47F">5</text><text x="940" y="245" text-anchor="middle" font-family="Archivo" font-size="30" fill="#7BC47F">♥</text></g>
  </svg>
  <div class="eyebrow">BUTTS STUDIOS · GAMES</div>
  <div class="name">Card Battle<i>.</i></div>
  <div class="line">Six cards each, six prizes on the table. The higher card takes the points.</div>
  <div class="foot">A new Daily Deal every day · cards.buttsstudios.com</div>
</body>
</html>
